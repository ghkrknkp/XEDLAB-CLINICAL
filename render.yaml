services:
  # 1. React Frontend — Static Site (100% Free)
  - type: web
    name: xedlab-clinical-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://xedlab-clinical-1.onrender.com/api

  # 2. FastAPI Backend — Web Service (100% Free)
  - type: web
    name: xedlab-clinical-api
    env: python
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./medreports.db
      - key: JWT_SECRET
        generateValue: true
      - key: LLM_PROVIDER
        value: none
      - key: STORAGE_PROVIDER
        value: local
