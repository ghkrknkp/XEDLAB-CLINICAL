services:
  # 1. React Frontend Static Site
  - type: web
    name: ai-medical-report-analyzer-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: ai-medical-report-analyzer-api
          property: host
          prefix: https://
          postfix: /api

  # 2. FastAPI Web Backend
  - type: web
    name: ai-medical-report-analyzer-api
    env: python
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: medreports-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: medreports-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: LLM_PROVIDER
        value: none
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: STORAGE_PROVIDER
        value: local

  # 3. Celery Background Worker
  - type: worker
    name: ai-medical-report-analyzer-worker
    env: python
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A app.workers.celery_app worker --loglevel=info --concurrency=2
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: medreports-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: medreports-redis
          property: connectionString
      - key: JWT_SECRET
        fromService:
          type: web
          name: ai-medical-report-analyzer-api
          envVarKey: JWT_SECRET

  # 4. Managed Redis Instance
  - type: redis
    name: medreports-redis
    region: oregon
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

# 5. Managed PostgreSQL Database
databases:
  - name: medreports-db
    databaseName: medreports
    user: meduser
    region: oregon
    plan: free
