services:
  # Full-stack service: FastAPI backend + React frontend (100% Free)
  - type: web
    name: xedlab-clinical-api
    env: python
    region: oregon
    # Root of repo — build.sh handles both frontend & backend
    buildCommand: chmod +x build.sh && ./build.sh
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./medreports.db
      - key: JWT_SECRET
        generateValue: true
      - key: LLM_PROVIDER
        value: none
      - key: STORAGE_PROVIDER
        value: local
      - key: NODE_VERSION
        value: "20"
